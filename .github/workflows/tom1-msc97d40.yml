name: Tom I — MSC 97D40 full chapter PDF and mathematical tests

on:
  push:
    branches: [main]
    paths:
      - 'manuscript/tom-01/MSC97/97D40_METODY_NAUCZANIA_MATEMATYKI.md'
      - 'tests/test_msc97d40_teaching.py'
      - 'tests/test_msc97d40_advanced.py'
      - 'tests/test_msc97d40_information.py'
      - 'tests/test_msc97d40_uncertainty.py'
      - 'tests/test_msc97d40_optimization.py'
      - 'tests/test_msc97d40_measurement.py'
      - 'manuscript/tom-01/MSC97/97D40_IIID_OPTYMALIZACJA_PROGRAMU_ZAJEC.md'
      - 'manuscript/tom-01/MSC97/97D40_IIIE_RZETELNOSC_POMIARU.md'
      - '.github/workflows/tom1-msc97d40.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install compilation toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex lmodern texlive-latex-recommended texlive-fonts-recommended fonts-dejavu-core poppler-utils
      - name: Run 97D40 mathematical tests
        run: |
          python3 -m unittest discover -s tests -p 'test_msc97d40_teaching.py' -v
          python3 -m unittest discover -s tests -p 'test_msc97d40_advanced.py' -v
          python3 -m unittest discover -s tests -p 'test_msc97d40_information.py' -v
          python3 -m unittest discover -s tests -p 'test_msc97d40_uncertainty.py' -v
          python3 -m unittest discover -s tests -p 'test_msc97d40_optimization.py' -v
          python3 -m unittest discover -s tests -p 'test_msc97d40_measurement.py' -v
      - name: Compile full 97D40 manuscript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          src=manuscript/tom-01/MSC97/97D40_METODY_NAUCZANIA_MATEMATYKI.md
          supp=manuscript/tom-01/MSC97/97D40_IIID_OPTYMALIZACJA_PROGRAMU_ZAJEC.md
          supp2=manuscript/tom-01/MSC97/97D40_IIIE_RZETELNOSC_POMIARU.md
          dst=out/MSC97D40_PELNY_ROZDZIAL.pdf
          pandoc "$src" "$supp" "$supp2" --standalone --from markdown+tex_math_dollars+tex_math_single_backslash --pdf-engine=xelatex -V mainfont="DejaVu Serif" -V sansfont="DejaVu Sans" -V geometry:margin=18mm -V papersize=a4 -V lang=pl-PL -o "$dst"
          test -s "$dst"
          pdfinfo "$dst" > out/PDFINFO.txt
          pdftotext "$dst" out/CONTENT.txt
          grep -q 'Metody nauczania matematyki' out/CONTENT.txt
          grep -q 'Z20' out/CONTENT.txt
          grep -q 'K10' out/CONTENT.txt
          grep -q 'T32' out/CONTENT.txt
          grep -q 'Z40' out/CONTENT.txt
          grep -q 'T42' out/CONTENT.txt
          grep -q 'Z50' out/CONTENT.txt
          grep -q 'T55' out/CONTENT.txt
          grep -q 'Z64' out/CONTENT.txt
          grep -q 'T65' out/CONTENT.txt
          grep -q 'Z80' out/CONTENT.txt
          pages=$(awk '/^Pages:/ {print $2}' out/PDFINFO.txt)
          test "$pages" -ge 17
          test "$(stat -c '%s' "$dst")" -lt 99000000
          sha256sum "$src" "$supp" "$supp2" "$dst" > out/SHA256SUMS.txt
          printf 'chapter=MSC97D40 pages=%s bytes=%s canonical_0.20_included=false\n' "$pages" "$(stat -c '%s' "$dst")" > out/METRICS.txt
      - name: Upload verified full chapter PDF
        uses: actions/upload-artifact@v4
        with:
          name: tom1-msc97d40-full-pdf
          path: |
            out/MSC97D40_PELNY_ROZDZIAL.pdf
            out/PDFINFO.txt
            out/SHA256SUMS.txt
            out/METRICS.txt
          if-no-files-found: error
