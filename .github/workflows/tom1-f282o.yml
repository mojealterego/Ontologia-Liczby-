name: Tom I F28.2-O variable contractions
on:
  push:
    branches: [main]
    paths:
      - 'manuscript/tom-01/F28/F28.2O_ZMIENNE_KONTRAKCJE.md'
      - 'tests/test_f282o_variable_contractions.py'
      - '.github/workflows/tom1-f282o.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact rational tests
        run: python3 -m unittest discover -s tests -p 'test_f282o_variable_contractions.py' -v
      - name: Install PDF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-latex-recommended texlive-fonts-recommended lmodern fonts-dejavu-core poppler-utils
      - name: Compile complete A4 supplement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          src=manuscript/tom-01/F28/F28.2O_ZMIENNE_KONTRAKCJE.md
          dst=out/F28_2O_PELNY_SUPLEMENT.pdf
          pandoc "$src" --from markdown+tex_math_dollars --pdf-engine=xelatex \
            -V geometry:a4paper -V geometry:margin=22mm \
            -V mainfont="DejaVu Serif" -V fontsize=10pt -V linestretch=1.10 \
            -V lang=pl-PL -o "$dst"
          test -s "$dst"
          test "$(stat -c %s "$dst")" -lt 99000000
          pdfinfo "$dst" > out/PDFINFO.txt
          grep -q '(A4)' out/PDFINFO.txt
          pdftotext "$dst" out/CONTENT.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path("out/CONTENT.txt").read_text(encoding="utf-8")
          for prefix,total in (("D",7),("T",8),("K",7),("Z",14)):
              for i in range(1,total+1):
                  if re.search(r"\b"+prefix+str(i)+r"\b",text) is None:
                      raise SystemExit("Missing marker "+prefix+str(i))
          PY
          sha256sum "$src" tests/test_f282o_variable_contractions.py "$dst" > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tom1-f282o-full-supplement
          path: |
            out/F28_2O_PELNY_SUPLEMENT.pdf
            out/PDFINFO.txt
            out/SHA256SUMS.txt
          if-no-files-found: error
