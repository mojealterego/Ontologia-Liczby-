name: Tom I E1-03 — exact-source PDF and powers tests

on:
  push:
    branches: [main]
    paths:
      - 'manuscript/tom-01/E1/E1-03_POTEGI_I_PIERWIASTKI.md'
      - 'tests/test_e103_powers_roots.py'
      - '.github/workflows/tom1-e103.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test exact committed source
        run: python3 -m unittest discover -s tests -p 'test_e103_powers_roots.py' -v
      - name: Install PDF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex lmodern texlive-latex-recommended texlive-fonts-recommended fonts-dejavu-core poppler-utils
      - name: Compile and verify complete chapter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          src=manuscript/tom-01/E1/E1-03_POTEGI_I_PIERWIASTKI.md
          dst=out/E1-03_POTEGI_I_PIERWIASTKI.pdf
          pandoc "$src" --standalone --from markdown+tex_math_dollars+tex_math_single_backslash --pdf-engine=xelatex \
            -V mainfont="DejaVu Serif" -V sansfont="DejaVu Sans" \
            -V papersize=a4 -V geometry:margin=18mm -V lang=pl-PL -o "$dst"
          test -s "$dst"
          pages=$(pdfinfo "$dst" | awk '/^Pages:/ {print $2}')
          test "$pages" -ge 4
          pdftotext "$dst" out/extracted.txt
          grep -q 'Zadanie 60' out/extracted.txt
          bytes=$(stat -c '%s' "$dst")
          test "$bytes" -lt 99000000
          sha256sum "$src" "$dst" | tee out/SHA256SUMS.txt
          printf 'E1-03 pages=%s bytes=%s\n' "$pages" "$bytes" | tee out/METRICS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tom1-e103-complete-pdf
          path: |
            out/E1-03_POTEGI_I_PIERWIASTKI.pdf
            out/SHA256SUMS.txt
            out/METRICS.txt
          if-no-files-found: error
