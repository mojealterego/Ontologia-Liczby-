name: Tom I F14.4 continued fraction verification
on:
  push:
    branches: [main]
    paths:
      - 'manuscript/tom-01/F14/F14.4_ULAMKI_LANCUCHOWE_I_CERTYFIKATY.md'
      - 'tests/test_f144.py'
      - '.github/workflows/tom1-f144.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact rational tests
        run: python3 -m unittest discover -s tests -p 'test_f144.py' -v
      - name: Install PDF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-latex-recommended lmodern fonts-dejavu-core poppler-utils
      - name: Build and inspect complete F14.4 PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          src=manuscript/tom-01/F14/F14.4_ULAMKI_LANCUCHOWE_I_CERTYFIKATY.md
          dst=out/F14_4_PELNY_SUPLEMENT.pdf
          pandoc "$src" --standalone --from markdown+tex_math_dollars --pdf-engine=xelatex -V mainfont="DejaVu Serif" -V papersize=a4 -o "$dst"
          test -s "$dst"
          pdftotext "$dst" out/CONTENT.txt
          python3 - <<'PY'
          from pathlib import Path
          t=Path("out/CONTENT.txt").read_text(encoding="utf-8")
          for marker in ("D1", "D6", "T1", "T9", "K1", "K5", "Z1", "Z10"):
              if marker not in t:
                  raise SystemExit("Missing marker: "+marker)
          PY
          pdfinfo "$dst" > out/PDFINFO.txt
          grep -q 'Page size:.*595.*842' out/PDFINFO.txt
          test "$(stat -c %s "$dst")" -lt 99000000
          sha256sum "$src" "$dst" > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tom1-f144-full-supplement
          path: |
            out/F14_4_PELNY_SUPLEMENT.pdf
            out/PDFINFO.txt
            out/SHA256SUMS.txt
          if-no-files-found: error
