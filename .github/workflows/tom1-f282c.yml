name: Tom I F28.2-C primal-dual certificates verification
on:
  push:
    branches: [main]
    paths:
      - 'manuscript/tom-01/F28/F28.2C_DUALNOSC_I_CERTYFIKATY.md'
      - 'tests/test_f282c_duality.py'
      - '.github/workflows/tom1-f282c.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact rational primal-dual tests
        run: python3 -m unittest discover -s tests -p 'test_f282c_duality.py' -v
      - name: Install PDF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-latex-recommended texlive-fonts-recommended lmodern fonts-dejavu-core poppler-utils
      - name: Build and inspect full F28.2-C PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          src=manuscript/tom-01/F28/F28.2C_DUALNOSC_I_CERTYFIKATY.md
          dst=out/F28_2C_PELNY_SUPLEMENT.pdf
          pandoc "$src" --from markdown+tex_math_dollars --pdf-engine=xelatex \
            -V documentclass=article -V papersize=a4 -V mainfont="DejaVu Serif" \
            -V geometry:margin=21mm -V fontsize=11pt -V linestretch=1.09 \
            -V colorlinks=false -o "$dst"
          test -s "$dst"
          pdftotext "$dst" out/CONTENT.txt
          python3 - <<'PY'
          from pathlib import Path
          t=Path("out/CONTENT.txt").read_text(encoding="utf-8")
          for marker in ("D1", "D7", "T1", "T9", "K1", "K6", "Z1", "Z12"):
              if marker not in t:
                  raise SystemExit("Missing marker: "+marker)
          PY
          pdfinfo "$dst" > out/PDFINFO.txt
          grep -q '(A4)' out/PDFINFO.txt
          test "$(stat -c %s "$dst")" -lt 99000000
          sha256sum "$src" "$dst" > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tom1-f282c-full-supplement
          path: |
            out/F28_2C_PELNY_SUPLEMENT.pdf
            out/PDFINFO.txt
            out/SHA256SUMS.txt
          if-no-files-found: error
