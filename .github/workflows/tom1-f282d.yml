name: Tom I F28.2-D proximal iteration verification
on:
  push:
    branches: [main]
    paths:
      - 'manuscript/tom-01/F28/F28.2D_ITERACJE_PROKSYMALNE.md'
      - 'tests/test_f282d_proximal.py'
      - 'tests/test_f282d_certificates.py'
      - '.github/workflows/tom1-f282d.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact rational proximal iteration tests
        run: python3 -m unittest discover -s tests -p 'test_f282d*.py' -v
      - name: Install PDF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-latex-recommended texlive-fonts-recommended lmodern fonts-dejavu-core poppler-utils
      - name: Build and verify full F28.2-D PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          src=manuscript/tom-01/F28/F28.2D_ITERACJE_PROKSYMALNE.md
          dst=out/F28_2D_PELNY_SUPLEMENT.pdf
          pandoc "$src" --from markdown+tex_math_dollars --pdf-engine=xelatex \
            -V papersize=a4 -V mainfont="DejaVu Serif" \
            -V geometry:margin=21mm -V fontsize=11pt -V linestretch=1.13 \
            -V colorlinks=false -o "$dst"
          test -s "$dst"
          pdftotext "$dst" out/CONTENT.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          t=Path("out/CONTENT.txt").read_text(encoding="utf-8")
          for prefix, maximum in (("D", 8), ("T", 10), ("K", 7), ("Z", 12)):
              for i in range(1, maximum + 1):
                  marker=f"{prefix}{i}"
                  if re.search(r"\b"+marker+r"\b",t) is None:
                      raise SystemExit("Missing marker: "+marker)
          PY
          pdfinfo "$dst" > out/PDFINFO.txt
          grep -q '(A4)' out/PDFINFO.txt
          test "$(stat -c %s "$dst")" -lt 99000000
          sha256sum "$src" tests/test_f282d_proximal.py tests/test_f282d_certificates.py "$dst" > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tom1-f282d-full-supplement
          path: |
            out/F28_2D_PELNY_SUPLEMENT.pdf
            out/PDFINFO.txt
            out/SHA256SUMS.txt
          if-no-files-found: error
